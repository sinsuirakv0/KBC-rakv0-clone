name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          find . -type f \( -name '*.sh' -o -path './bin/kbc-clone' \) -print0 |
            xargs -0 -n1 bash -n
      - name: Run tests
        run: |
          for test_file in tests/test-*.sh; do
            bash "${test_file}"
          done
